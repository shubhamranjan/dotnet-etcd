name: .NET Build, Test and Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          10.0.x
          9.0.x
          8.0.x
    
    - name: Start test etcd containers
      run: |
        chmod +x dotnet-etcd.Tests/*.sh
        # start-etcd.sh generates the TLS certs if missing and waits until etcd is actually
        # serving, so the integration tests below don't race container startup.
        dotnet-etcd.Tests/start-etcd.sh
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore
    
    - name: Install Coverage Tools
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        dotnet tool install --global dotnet-coverage
    
    - name: Run Unit Tests with Coverage
      run: dotnet test dotnet-etcd.Tests/dotnet-etcd.Tests.csproj --filter "Category=Unit" --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Run Integration Tests with Coverage
      # Collect coverage here too; reportgenerator globs ./coverage/** and merges both
      # cobertura files, so the report reflects combined unit + integration coverage.
      run: dotnet test dotnet-etcd.Tests/dotnet-etcd.Tests.csproj --filter "Category=Integration" --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
    
    - name: Generate Coverage Report
      run: |
        reportgenerator -reports:./coverage/**/coverage.cobertura.xml -targetdir:./coveragereport -reporttypes:Html,Cobertura,TextSummary,Badges -classfilters:"-Authpb.*;-Etcdserverpb.*;-Mvccpb.*;-V3Electionpb.*;-V3Lockpb.*;-Versionpb.*;-Gogoproto.*"
        touch ./coveragereport/.nojekyll
        cat ./coveragereport/Summary.txt

    - name: Enforce coverage floor
      # Coverage is reported but was never gated, which is how ten tests without a Category trait
      # silently dropped out of CI. Fail the build if line coverage regresses below the floor;
      # raise the floor when coverage goes up.
      env:
        MIN_LINE_COVERAGE: "95"
      run: |
        LINE=$(sed -nE 's/^ *Line coverage: ([0-9]+(\.[0-9]+)?)%.*/\1/p' ./coveragereport/Summary.txt)
        echo "line coverage: ${LINE}% (floor ${MIN_LINE_COVERAGE}%)"
        awk -v c="$LINE" -v m="$MIN_LINE_COVERAGE" 'BEGIN { exit (c+0 >= m+0) ? 0 : 1 }' \
          || { echo "::error::line coverage ${LINE}% is below the ${MIN_LINE_COVERAGE}% floor" >&2; exit 1; }
    
    - name: Upload Coverage Report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-report
        path: ./coveragereport
        retention-days: 30
    
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: ./coveragereport/Summary.txt
    
    - name: Publish Coverage Report to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
      with:
        folder: ./coveragereport
        branch: gh-pages
        clean: true
