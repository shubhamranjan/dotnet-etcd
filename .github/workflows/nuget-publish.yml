name: Publish to NuGet

on:
  push:
    tags:
      # Only publish on version tags, not arbitrary tags. Covers stable (8.1.0)
      # and pre-release (8.2.0-beta) tags, with or without a leading 'v'.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Re-publish an existing tag by hand, e.g. after a failed push, without re-tagging.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (e.g. 10.0.0)"
        required: true
        type: string

permissions:
  # Create the GitHub Release and upload the .nupkg to it.
  contents: write
  # Let the job mint an OIDC token. NuGet/login exchanges it for a one-hour nuget.org API key
  # against the Trusted Publishing policy registered for this repo + workflow file, so no
  # long-lived NUGET_API_KEY secret is stored or can expire.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

    - name: Get Version
      run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release -p:Version=${{ env.VERSION }}

    - name: Pack
      run: dotnet pack --no-build -c Release -p:PackageVersion=${{ env.VERSION }} -o ./artifacts

    # Requested right before the push: the temporary key is valid for one hour.
    - name: NuGet login (OIDC -> temporary API key)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        # nuget.org profile name that owns the package (not an email). Public information.
        user: shubhamranjan

    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Auto-generate notes from PRs merged since the previous tag (grouped per
        # .github/release.yml). Mark pre-release tags (those with a '-' suffix).
        PRERELEASE=""
        case "$VERSION" in
          *-*) PRERELEASE="--prerelease" ;;
        esac
        gh release create "$TAG" \
          --title "$TAG" \
          --generate-notes \
          --verify-tag \
          $PRERELEASE \
          ./artifacts/*.nupkg
