# Dependabot configuration file
# See documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NuGet dependencies (library + test project). One entry with both directories so
  # packages that must move together (Microsoft.Extensions.*, Grpc.*) land in one PR,
  # and minor/patch bumps are grouped into a single weekly PR instead of one per package.
  - package-ecosystem: "nuget"
    directories:
      - "/dotnet-etcd"
      - "/dotnet-etcd.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    reviewers:
      - "shubhamranjan"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Wait a week before proposing a freshly published version: gives upstream time to pull a
    # bad or compromised release before it reaches us.
    cooldown:
      default-days: 7
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Major bumps still arrive as individual PRs so they can be reviewed on their own.

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    reviewers:
      - "shubhamranjan"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
